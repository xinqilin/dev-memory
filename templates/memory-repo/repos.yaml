# 產品跟 code repo 的對應。寫文件時要讀哪些 repo 的程式碼，看這裡。
#
# 這個檔案會發給每個隊友，所以**只寫 repo 身分，不寫本機路徑**。
# 每個人 clone 的位置不同，本機路徑放在各自的 ~/.dev-memory/config.toml 的 [repos] 段。
#
# refs 是「去哪幾支分支找程式碼」，依序試、找到就用。
# 填你們團隊「開發完成的程式碼會在哪一支」——通常是 dev 或 main。
products:
  <產品名>:
    repos:
      - id: <owner>/<repo>
        refs: [main]              # 依序試，找到就用。例如 [dev, staging, master]

      # 一支批次一個分支的情況：
      # - id: <owner>/<repo>
      #   refs: [master]
      #   branch_per_job: true
      #   job_branch_prefix: batch/
