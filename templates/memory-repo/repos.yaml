# 產品跟 code repo 的對應。寫文件時要讀哪些 repo 的程式碼，看這裡。
#
# 這個檔案會發給每個隊友，所以**只寫 repo 身分，不寫本機路徑**。
# 每個人 clone 的位置不同，本機路徑放在各自的 ~/.dev-memory/config.toml 的 [repos] 段。
#
# refs 是「去哪幾支分支找程式碼」，**依序試，找到就用**。
# 沒有單一正確答案，同一個團隊裡也不會一致。實際遇過的四種情況：
#   - dev / staging 有的功能，master 還沒有
#   - master 反而比 dev 新
#   - 根本沒有 dev
#   - master 幾年沒動，程式在 <prefix>/<job> 這種分支上
# 所以文件一定要寫明內容出自哪一支 ref，尚未進 trunk 的要標明。
products:
  <產品名>:
    repos:
      - id: <owner>/<repo>
        refs: [main]              # 依序試，找到就用。例如 [dev, staging, master]

      # 一支批次一個分支的情況：
      # - id: <owner>/<repo>
      #   refs: [master]
      #   branch_per_job: true
      #   job_branch_prefix: batch/
